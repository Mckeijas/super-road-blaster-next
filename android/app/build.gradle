plugins {
    id 'com.android.application'
}

// --- Versión y nombre de la APK ----------------------------------------------------------
// srbVersion (gradle.properties) = MAYOR.MENOR.PARCHE  ->  versionCode = MAYOR*10000+MENOR*100+PARCHE
def srbVersionName = (project.findProperty('srbVersion') ?: '1.3.0').toString().trim()
def srbParts = srbVersionName.tokenize('.').collect { it.replaceAll('[^0-9]', '') as int }
while (srbParts.size() < 3) srbParts << 0
def srbVersionCode = srbParts[0] * 10000 + srbParts[1] * 100 + srbParts[2]
// APK: SuperRoadBlasterNext-v1.3.0-release.apk / SuperRoadBlasterNext-v1.3.0-debug.apk
base {
    archivesName = "SuperRoadBlasterNext-v${srbVersionName}"
}

android {
    namespace 'com.srbport.roadblaster'
    compileSdk 35

    defaultConfig {
        applicationId 'com.srbport.roadblaster'
        minSdk 30
        targetSdk 35
        versionCode srbVersionCode
        versionName srbVersionName
        ndk {
            abiFilters 'arm64-v8a'          // AYN Odin 2 Portal (Snapdragon 8 Gen 2)
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-O3'
            }
        }
    }

    // Fixed signing key: every build (debug and release) is signed with the same key, so
    // new versions install over the old one and your saves are kept. Keep a backup of
    // android/keystore/srbn.keystore: if it is lost, Android will refuse updates and the
    // app would have to be uninstalled (deleting its data) before installing.
    signingConfigs {
        srbn {
            storeFile rootProject.file('keystore/srbn.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // the emulator is always compiled with optimisations (see CMakeLists.txt)
            debuggable true
            signingConfig signingConfigs.srbn
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.srbn
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

// --- Game data -----------------------------------------------------------------------
// Since 1.5.0 the APK carries no game data: the player imports their own .zip of Super
// Road Blaster from the launcher, and the scene states, thumbnails and Enhanced audio are
// produced on the device (see GameImporter.java and srb/scene_gen.cpp).

