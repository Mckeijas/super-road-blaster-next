# --- Super Road Blaster port ---------------------------------------------------
# Carpeta con TUS archivos del juego: SuperRoadBlaster.sfc, SuperRoadBlaster.msu y
# SuperRoadBlaster-0.pcm ... SuperRoadBlaster-121.pcm. Relativa a esta carpeta
# (android/) o absoluta con barras normales, p. ej. D:/PROYECTO PORT/snes-msu1/SuperRoadBlaster
srbGameDir=../..
# Datos generados para el port: estados de cada escena y audio MSU-1 Enhanced
srbGameDataDir=../gamedata

# Versión de la app. Súbela en cada build que instales (1.3.0 -> 1.3.1 -> 1.4.0 ...).
# versionCode se calcula solo: MAYOR*10000 + MENOR*100 + PARCHE (1.3.0 -> 10300).
# Android nunca instala una versión con número menor que la instalada.
srbVersion=1.8.6

# --- Gradle ------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
