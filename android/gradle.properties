# --- Super Road Blaster port ---------------------------------------------------
# La APK no lleva el juego: se carga desde la app con tu .zip de Super Road Blaster.

# Versión de la app. Súbela en cada build que instales (1.5.0 -> 1.5.1 -> 1.6.0 ...).
# versionCode se calcula solo: MAYOR*10000 + MENOR*100 + PARCHE (1.3.0 -> 10300).
# Android nunca instala una versión con número menor que la instalada.
srbVersion=1.5.0

# --- Gradle ------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
